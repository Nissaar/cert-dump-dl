# Checks a dependency bump cannot silently break the tool: its Python dependencies must
# install together, import, and the image must still build (weasyprint needs system libs).
name: PR validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependencies install and import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libgdk-pixbuf-2.0-0
          pip install -r app/requirements.txt
      - name: Dependency set is consistent
        run: pip check
      - name: Modules import and compile
        run: |
          python -c "import jinja2, rich, requests, bs4, weasyprint"
          python -m compileall -q app

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t cert-dump-dl:pr .
